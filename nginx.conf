server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

  # API, OpenAPI docs and probes are served by the backend (same origin => cookies + CSRF just work)
  location ~ ^/(api/|docs|redoc|openapi.json|health|ready) {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Embeddable tracking SDK: <script src="https://HOST/sdk/analytics.min.js"></script>
  location /sdk/ {
    alias /usr/share/nginx/html/sdk/;
    add_header Cache-Control "public, max-age=3600";
    add_header Access-Control-Allow-Origin "*";
  }

  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
