name: Temporary formatting pass

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format source
        run: npm run format

      - name: Remove temporary workflow
        run: rm .github/workflows/temporary-formatting.yml

      - name: Commit formatting-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/temporary-formatting.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: format frontend source"
          git push

# Trigger formatting on the current PR head.
