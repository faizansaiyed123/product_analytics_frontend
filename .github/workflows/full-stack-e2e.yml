name: Full-stack integration and visual walkthrough

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
          POSTGRES_DB: analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://analytics:analytics@127.0.0.1:5432/analytics_test
      REDIS_URL: redis://127.0.0.1:6379/15
      JWT_SECRET: full-stack-e2e-jwt-secret-0123456789-abcdefgh
      API_KEY_SECRET: full-stack-e2e-api-key-secret-0123456789
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      PUBLIC_APP_URL: http://127.0.0.1:5173
      EXPORT_DIR: /tmp/product-analytics-exports

    steps:
      - name: Checkout frontend branch (not the synthetic PR merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true

      - name: Checkout real backend repository
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/product_analytics_backend
          ref: qa/fix-rate-limit-test-flakiness
          path: backend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install backend dependencies and apply real PostgreSQL migrations
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          alembic upgrade head

      - name: Run backend API and database tests
        working-directory: backend
        run: python -m pytest -q

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run frontend UI regression tests
        run: npm test -- --reporter=dot

      - name: Run lint, typecheck, and production build
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Install Playwright and Chromium for real-browser testing
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test
          npx playwright install --with-deps chromium

      - name: Start the real FastAPI backend
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/product-analytics-backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend liveness endpoint is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/product-analytics-backend.log
          exit 1

      - name: Start background worker for queued exports
        working-directory: backend
        run: |
          nohup python -m app.workers.main > /tmp/product-analytics-worker.log 2>&1 &
          for i in $(seq 1 30); do
            if grep -q "worker started" /tmp/product-analytics-worker.log 2>/dev/null; then
              echo "Background worker is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/product-analytics-worker.log
          exit 1

      - name: Start the real frontend with the API proxy
        env:
          VITE_BACKEND_URL: http://127.0.0.1:8000
        run: |
          nohup npm run dev -- --host 127.0.0.1 > /tmp/product-analytics-frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/login > /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/product-analytics-frontend.log
          exit 1

      - name: Run browser-driven frontend to API to PostgreSQL journey
        run: npx playwright test --config=playwright.config.ts

      - name: Verify persisted records directly in PostgreSQL
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio, json, os
          import asyncpg

          async def main():
              dsn = os.environ["DATABASE_URL"].replace("postgresql+asyncpg://", "postgresql://", 1)
              with open("../test-results/e2e-state.json", encoding="utf-8") as f:
                  state = json.load(f)
              conn = await asyncpg.connect(dsn)
              try:
                  pid, email = state["project_id"], state["email"].lower()
                  checks = {
                      "registered user": await conn.fetchval("SELECT count(*) FROM users WHERE lower(email) = $1", email),
                      "project": await conn.fetchval("SELECT count(*) FROM projects WHERE id = $1::uuid AND name = $2", pid, state["project_name"]),
                      "API key record": await conn.fetchval("SELECT count(*) FROM api_keys WHERE project_id = $1::uuid AND revoked_at IS NULL", pid),
                      "revoked API key": await conn.fetchval("SELECT count(*) FROM api_keys WHERE project_id = $1::uuid AND name = $2 AND revoked_at IS NOT NULL", pid, state["revoked_key_name"]),
                      "retention setting": await conn.fetchval("SELECT count(*) FROM projects WHERE id = $1::uuid AND settings->>'retention_days' = $2", pid, str(state["retention_days"])),
                      "ingested events": await conn.fetchval("SELECT count(*) FROM events WHERE project_id = $1::uuid", pid),
                      "resolved people": await conn.fetchval("SELECT count(*) FROM persons WHERE project_id = $1::uuid", pid),
                      "event definitions": await conn.fetchval("SELECT count(*) FROM event_definitions WHERE project_id = $1::uuid", pid),
                      "saved report": await conn.fetchval("SELECT count(*) FROM reports WHERE project_id = $1::uuid AND name = $2", pid, state["report_name"]),
                      "saved cohort": await conn.fetchval("SELECT count(*) FROM cohorts WHERE project_id = $1::uuid AND name = $2", pid, state["cohort_name"]),
                      "saved dashboard": await conn.fetchval("SELECT count(*) FROM dashboards WHERE project_id = $1::uuid AND name = $2", pid, state["dashboard_name"]),
                      "saved alert": await conn.fetchval("SELECT count(*) FROM alerts WHERE project_id = $1::uuid AND name = $2", pid, state["alert_name"]),
                      "finished export job": await conn.fetchval("SELECT count(*) FROM export_jobs WHERE project_id = $1::uuid AND status = 'done'", pid),
                  }
                  for label, count in checks.items():
                      print(f"{label}: {count}")
                  expected = {"registered user": 1, "project": 1, "API key record": 1, "revoked API key": 1, "retention setting": 1, "saved report": 1, "saved cohort": 1, "saved dashboard": 1, "saved alert": 1, "finished export job": 1}
                  failures = [f"{label} expected >= {minimum}, got {checks[label]}" for label, minimum in expected.items() if checks[label] < minimum]
                  for label, minimum in (("ingested events", state["expected_events"]), ("resolved people", 2), ("event definitions", 3)):
                      if checks[label] < minimum:
                          failures.append(f"{label} expected >= {minimum}, got {checks[label]}")
                  if failures:
                      raise SystemExit("\n".join(failures))
              finally:
                  await conn.close()
          asyncio.run(main())
          PY

      - name: Verify production frontend container and public SDK paths
        run: |
          docker build --tag product-analytics-frontend:e2e .
          docker run --detach --rm --name product-analytics-frontend-e2e --add-host=backend:host-gateway -p 127.0.0.1:8080:80 product-analytics-frontend:e2e
          trap 'docker stop product-analytics-frontend-e2e >/dev/null 2>&1 || true' EXIT
          # Wait for Nginx from inside the container, then verify the host port mapping too.
          ready=0
          for attempt in $(seq 1 30); do
            if ! docker inspect --format '{{.State.Running}}' product-analytics-frontend-e2e 2>/dev/null | grep -q true; then
              docker logs product-analytics-frontend-e2e || true
              exit 1
            fi
            if docker exec product-analytics-frontend-e2e wget -q -O /dev/null http://127.0.0.1/login; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs product-analytics-frontend-e2e
            exit 1
          fi
          for url in /login /sdk/analytics.min.js /sdk/analytics.esm.js; do
            rm -f /tmp/response-body
            if ! curl --retry 5 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 8 --fail --silent --show-error "http://127.0.0.1:8080$url" -o /tmp/response-body; then
              docker logs product-analytics-frontend-e2e
              exit 1
            fi
            test -s /tmp/response-body
            echo "OK $url"
          done

      - name: Commit actual browser screenshots to the PR branch
        if: success() && github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing/visuals/*.png
          if ! git diff --cached --quiet; then
            git commit -m "test: capture verified full-stack walkthrough screenshots [skip ci]"
            git push origin "HEAD:$BRANCH_NAME"
          else
            echo "No new screenshot files to commit"
          fi

      - name: Upload logs, database assertions, traces, and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-analytics-full-stack-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            docs/testing/visuals/*.png
            test-results/
            /tmp/product-analytics-backend.log
            /tmp/product-analytics-frontend.log
            /tmp/product-analytics-worker.log
